name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux-build:
    runs-on: ubuntu-24.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 安装分析工具
        run: sudo apt-get update && sudo apt-get install -y cppcheck ninja-build

      # 配置一致性门槛。放在构建之前：跨层引用错误比编译失败更廉价，应当快速失败。
      # 悬空的 motion_profile_id 之类的错误不一定会让生成器报错，因此必须显式校验。
      - name: 校验配置
        run: python3 gen/validate_project.py

      # P9.1 的防回退检查。SOEM 访问被多个线程共用，安全性靠 SOEM 自带的锁成立
      # （见 session_internal.h 顶部说明）。新出现一个调用点就是新出现一个潜在的
      # 共用方，必须由人确认后再登记。同样是纯文本检查，放在构建之前快速失败。
      - name: 校验 SOEM 调用点
        run: bash checks/soem_call_sites.sh

      # 又一条纯文本的结构检查，与上面那条同源。主线程在进 OP 前先把自己升成
      # SCHED_FIFO 并绑核，而 Linux 上 pthread_create 新建的线程会**继承**创建者
      # 的调度策略与优先级——于是"非实时"的观测/监听线程会悄悄变成 SCHED_FIFO，
      # 与周期线程同核同级。同核同优先级的 FIFO 之间不抢占，所以后果是周期被整段
      # 挡住，而表面上总线照通、帧距照对。新加一个线程却忘了那一句时，这条拦住它。
      - name: 主站线程调度（离线）
        run: python3 checks/master_thread_sched_check.py

      # 两条纯 Python 的离线检查，都不需要硬件、不需要 PyQt5，所以在 CI 上跑得动。
      # 它们钉住的是两件"出错了也不会喊"的事：界面自检日志的判定（上一轮台架监控
      # 半边整场零帧，而脚本只把那句话打印出来就算通过），以及绑核缓存（失效时
      # 程序照样跑，只是每秒多重绑 122 次、日志刷到 657 KB）。
      # 放在构建之前：都是纯文本/纯 Python，几秒钟的事，应当快速失败。
      - name: 界面证据判定（离线）
        run: python3 checks/gui_evidence_check.py

      - name: 绑核缓存（离线）
        run: python3 checks/rt_affinity_check.py

      # 又是两条"写歪了不会喊"的检查。控制台的观测开关默认必须是关的：默认成开会
      # 让每个手动拉起的主站白付每拍一次的组帧代价，而屏幕上什么都不说。报告里
      # 慢速遥测那几个 0 更阴——"没读到"印成 0.0°C 长得就像"这一路很凉"，而它本来
      # 该印成「—」（P11.8）。
      - name: 控制台观测开关（离线）
        run: bash checks/console_obs_switch_check.sh

      - name: 报告慢速遥测渲染（离线）
        run: python3 checks/report_telemetry_check.py

      # 本轮"证据留得住 + 停得下来"那一半的守卫。它们盯的三种死法有一个共同的性子：
      # **出错了也不喊**——报告文件照旧躺在原地、工具照旧退出 0、主站照旧跑着。
      # ① 归档静默削旧（P12.29）：削掉的正是要回头比对的底稿；
      # ② 分析工具硬编码报告路径（P12.30）：读某份报告拿到的是另一份的数字；
      # ③ 命令口的 stop 走了一条不接安全门的空路（P12.1）：回 OK，什么都不发生。
      # 后面每条的 --mutate 是同一批检查的对抗性对照：把缺陷塞回临时副本，必须变红。
      - name: 分析工具不得硬编码报告路径（离线）
        run: python3 checks/analysis_tools_check.py

      - name: 硬编码路径检查的判别力（离线，期望不通过）
        run: python3 checks/analysis_tools_check.py --mutate

      - name: 命令口停机走安全门（离线）
        run: python3 checks/stop_path_check.py

      - name: 停机路径检查的判别力（离线，期望不通过）
        run: python3 checks/stop_path_check.py --mutate

      - name: 慢速遥测渲染的判别力（离线，期望不通过）
        run: python3 checks/report_telemetry_check.py --mutate

      # 下面两条自带 cc 编译（把报告库单独编出来跑），所以不用等 cmake 那两步：
      # 它们判的分别是"报告还解析得动吗"（少一个闭括号，C 断言全过、整份 JSON 死掉）
      # 与"削旧删了谁、删的时候出没出声"。
      - name: 报告故障字段的 JSON 合法性（离线）
        run: python3 checks/report_axis_fault_check.py

      - name: 故障字段检查的判别力（离线，期望不通过）
        run: python3 checks/report_axis_fault_check.py --mutate

      - name: 归档削旧与删除留声（离线）
        run: python3 checks/report_archive_check.py

      - name: 削旧检查的判别力（离线，期望不通过）
        run: python3 checks/report_archive_check.py --mutate

      # 装置指纹的 schema 在 2026-10 之前没有任何东西在执行：没有代码读它，也没有工具
      # import jsonschema。它就在那种状态下漂移了 —— 生产者后来加了 mbx_rl 字段，
      # schema 没跟着声明，于是"按 schema 合格"对两份入库指纹并不成立。
      # 这条的变异对照是内建的（不像上面几条要 --mutate）：它太便宜，
      # 没有理由让它依赖"记得加那个参数"。
      - name: 装置指纹符合 schema（离线）
        run: python3 checks/fingerprint_schema_check.py

      # 控制台引擎与按键层的离线回归，外加启动窗口那条检查的对抗性对照。
      # 对照单独跑一次是有意的：它证明"主站还在启动"那段窗口的检查抓得住
      # 裸下标（2026-09-18 面板一帧就死、主站没人看着跑到两根轴进故障那个）。
      # 不带对照的话，这条检查哪天变成永远绿也没人知道。
      - name: 控制台引擎回归（离线）
        run: python3 checks/console_engine_check.py --selftest

      - name: 启动窗口检查的判别力（离线，期望不通过）
        run: python3 checks/console_engine_check.py --mutate-startup-window

      - name: 配置
        run: cmake --preset linux-debug

      - name: 构建
        run: cmake --build --preset linux-debug --parallel 2

      # 观测通道的离线自测。它不需要 EtherCAT 硬件，因此能在 CI 上跑；这条命令的
      # 价值在于把"读者不得撕裂、不得阻塞写者"这类性质钉进回归，而不是等台架上
      # 出了问题再回头猜。含对抗性对照探针，跑一次约几秒。
      - name: 观测通道离线自测
        run: ./build/linux-debug/apps/observation_selftest/observation-selftest

      # 单元测试：周期恢复语义、错误预算滑动窗口。两条都复刻了现场故障，且都在
      # 两个方向上钉住判别力（既要抓住真故障，也要放过健康的长跑）。不依赖 SOEM
      # 与硬件，因此必须进 CI——留在文件头的手工编译命令里就等于没跑过。
      - name: 单元测试
        run: ctest --test-dir build/linux-debug --output-on-failure

      - name: 静态分析
        run: >-
          cppcheck --enable=warning,performance,portability --error-exitcode=1
          --std=c11 --suppress=missingIncludeSystem
          -I include -I build/linux-debug/generated
          src/catalog src/bus/soem src/bus/observation apps/fingerprint
