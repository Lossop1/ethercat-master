name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux-build-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install analysis tools
        run: sudo apt-get update && sudo apt-get install -y cppcheck ninja-build

      - name: Configure
        run: cmake --preset linux-debug

      - name: Build
        run: cmake --build --preset linux-debug --parallel 2

      - name: Test
        run: ctest --preset linux-debug

      - name: Static analysis
        run: >-
          cppcheck --enable=warning,performance,portability --error-exitcode=1
          --std=c11 --suppress=missingIncludeSystem
          -I include -I build/linux-debug/generated
          src/core src/soem apps/fingerprint tests
